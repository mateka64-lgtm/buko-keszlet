<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#474c52">
<title>BUKÓ Készlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bar:#474c52;--bg:#f6f4f0;--card:#fff;--ink:#1d1d1b;--muted:#6b6862;--line:#e6e2da;--acc:#c85a17;--acc-ink:#fff;
--ok:#256b42;--ok-bg:#e3f2e8;--low:#8a5d00;--low-bg:#fbefcf;--no:#9b3326;--no-bg:#f8e1dc}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--card:#1f1e1b;--ink:#f1efe9;--muted:#a29e95;--line:#33312c;
--ok:#74cc97;--ok-bg:#1b3124;--low:#eac466;--low-bg:#382e15;--no:#f2907f;--no-bg:#3b201b}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:var(--bar);color:var(--acc-ink);padding:14px 14px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand b{display:block;font-size:18px;font-weight:700;letter-spacing:.2px}
.brand span{font-size:13px;opacity:.85;display:block}
.brand .logo{display:inline-flex;width:44px;height:44px;border-radius:9px;background:#fff;padding:3px;align-items:center;justify-content:center;margin-right:11px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.brand .logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand{display:flex;align-items:center;min-width:0}
.brand b,.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid rgba(255,255,255,.65);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:inherit;font:600 13px Inter,sans-serif;padding:7px 12px;cursor:pointer}
.lang button.on{background:#fff;color:var(--bar)}
.search{margin-top:12px;position:relative}
.search input{width:100%;font:16px Inter,sans-serif;padding:12px 40px 12px 14px;border-radius:12px;border:0;outline:none;background:#fff;color:#1d1d1b}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;color:#8a867e;cursor:pointer;padding:4px 8px;display:none}
main{padding:12px 12px 24px}
.demo{background:var(--low-bg);color:var(--low);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px;font-size:13.5px;color:var(--muted)}
.bar label{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.bar input{width:18px;height:18px;accent-color:var(--acc)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.name{font-weight:600;font-size:15px;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.right{text-align:right;flex:none;max-width:45%}
.badge{display:inline-block;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.low{background:var(--low-bg);color:var(--low)}.no{background:var(--no-bg);color:var(--no)}
.qty{font-size:13px;color:var(--muted);margin-top:5px;white-space:nowrap}
.price{font-weight:600;font-size:14px;margin-top:2px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{padding:4px 16px 34px;font-size:13px;color:var(--muted);line-height:1.6}
footer b{color:var(--ink);font-weight:600}
.admin{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.admin label{color:var(--acc);font-weight:600;cursor:pointer}
.admin input{display:none}
.msg{margin-top:6px;font-weight:500}
.live{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;opacity:.95}
.dot{width:8px;height:8px;border-radius:50%;background:#7CFFB0;box-shadow:0 0 0 0 rgba(124,255,176,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,255,176,.6)}70%{box-shadow:0 0 0 8px rgba(124,255,176,0)}100%{box-shadow:0 0 0 0 rgba(124,255,176,0)}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.sum b{display:block;font-size:20px}
.sum span{font-size:12px;color:var(--muted)}
.sum .s-ok b{color:var(--ok)}.sum .s-low b{color:var(--low)}.sum .s-no b{color:var(--no)}
.item{cursor:pointer;transition:transform .08s}
.item:active{transform:scale(.99)}
.sheet-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 18px 26px;transform:translateY(100%);transition:transform .25s ease;z-index:21}
.open .sheet-bg{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:19px;margin:0 0 4px;line-height:1.3}
.sheet .meta{margin-bottom:14px}
.big{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.big .q{font-size:30px;font-weight:700}
.big .q small{font-size:15px;font-weight:500;color:var(--muted)}
.big .p{text-align:right;font-size:20px;font-weight:700}
.big .p small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.info{font-size:13.5px;color:var(--muted);line-height:1.5}
.close{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;font:600 15px Inter,sans-serif;background:var(--acc);color:#fff;cursor:pointer}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.contact button,.contact a{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 10px;font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn-call{background:#2f7d4f;color:#fff}
.btn-route{background:var(--card);color:var(--ink);border:1px solid var(--line)!important}
.contact svg{width:19px;height:19px}
.bell{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--acc)}
.bell svg{width:15px;height:15px}
.watch{width:100%;margin-top:14px;border:2px solid var(--acc);background:transparent;color:var(--acc);border-radius:12px;padding:12px;font:600 15px Inter,sans-serif;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.watch.on{background:var(--acc);color:#fff}
.watch svg{width:18px;height:18px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-30px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;z-index:40;max-width:92%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.arrived{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;margin-bottom:10px;display:none}
.phone-txt{font-size:12.5px;color:var(--muted);text-align:center;margin:-6px 0 12px}
</style>

</head>

  const q = it.qty > 0 ? `<div class="q">${num(it.qty, Number.isInteger(it.qty) ? 0 : 2)} <small>${esc(it.unit)} · ${t.onStock}</small></div>` : `<div class="q">0 <small>${esc(it.unit)}</small></div>`;
  const p = CONFIG.showPrice && it.price > 0 ? `<div class="p">${num(it.price, 2)} €<small>${t.perUnit} / ${esc(it.unit)} · ${t.vat}</small></div>` : "";
  const wb = it.qty <= 0 ? `<button class="watch ${w ? "on" : ""}" id="watchBtn">${BELL}<span>${w ? t.watching : t.watchBtn}</span></button>` : "";
  $("sheet").innerHTML = `<div class="grab"></div><span class="badge ${s}">${t[s]}</span><h2 style="margin-top:10px">${esc(it.name)}</h2><div class="meta">${meta}</div>
    <div class="big">${q}${p}</div><div class="info">${it.qty > 0 ? t.info : t.noStockInfo}</div>${wb}<button class="close" id="closeBtn">${t.close}</button>`;
  $("sheetWrap").classList.add("open");
  $("closeBtn").onclick = closeSheet;
  if ($("watchBtn")) $("watchBtn").onclick = () => toggleWatch(it.code);
}
function closeSheet() {
  $("sheetWrap").classList.remove("open");
}
$("q").addEventListener("input", render);
$("clr").addEventListener("click", () => {
  $("q").value = "";
  render();
  $("q").focus();
});
$("only").addEventListener("change", (e) => {
  only = e.target.checked;
  render();
});
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  cat = b.dataset.c;
  renderChips();
  render();
});
$("list").addEventListener("click", (e) => {
  const el = e.target.closest(".item");
  if (el) openSheet(+el.dataset.i);
});
$("sheetBg").addEventListener("click", closeSheet);
$("callBtn").addEventListener("click", call);
$("routeBtn").addEventListener("click", route);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeSheet();
});
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.l;
  store.set("buko-lang", lang);
  closeSheet();
  saveWatch();
  applyLang();
}));
if (NATIVE) {
  Runner.dispatchEvent({ label: RUNNER, event: "getWatch", details: {} }).then((r) => {
    if (r && typeof r.watch === "string") {
      try {
        watch = JSON.parse(r.watch) || [];
        store.set("buko-watch", r.watch);
        renderChips();
        render();
      } catch (e) {
      }
      saveWatch();
    }
  }).catch(() => {
  });
  if (AppP) AppP.addListener("resume", loadStock);
}
applyLang();
loadStock();
setInterval(loadStock, 15 * 60 * 1e3);
</script>
</body>
</html>
